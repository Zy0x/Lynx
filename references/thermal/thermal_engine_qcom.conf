# Qualcomm Thermal-Engine Configuration Ground Truth
# Reference: Xiaomi Redmi Note 7 (Lavender) /vendor/etc/thermal-engine.conf

[SS-GPU]
algo_type ss
sampling 250
sensor gpu-usr
device gpu
set_point 75000
set_point_clr 65000
time_constant 0

[SS-CPU-BIG]
algo_type ss
sampling 100
sensor tsens_tz_sensor9
device cpu4
set_point 78000
set_point_clr 68000

[SS-QUIET-THERM]
algo_type ss
sampling 1000
sensor quiet-therm-usr
device cluster0
set_point 46000
set_point_clr 43000
